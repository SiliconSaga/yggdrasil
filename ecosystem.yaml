# ecosystem.yaml — Yggdrasil Upstream Defaults
#
# This file provides generic defaults for Yggdrasil workspaces.
# Community-specific configuration (components, identity, build adapters)
# lives in an overlay repo under overlays/.
#
# Three-layer config merge:
#   ecosystem.yaml (this file — upstream defaults)
#     ↓ deep merge
#   overlay/ecosystem.yaml (community config)
#     ↓ deep merge
#   ecosystem.local.yaml (per-developer overrides, gitignored)
#
# See docs/plans/2026-03-26-overlay-architecture-design.md for details.

defaults:
  # Fallback URL for the GDD documentation home.
  # Override in your overlay or ecosystem.local.yaml to point at an internal instance.
  gddHome: https://siliconsaga.github.io/yggdrasil/gdd/

# Components are declared by overlays, not upstream.
# If no overlay is active, ws list/clone will show guidance.
#
# Component fields (declared in overlay ecosystem.yaml):
#   tier:          Deployment tier (1, 2, 3) or "supporting"
#   chartVersion:  Helm chart version to use when no local source is present
#   chartName:     Override chart name if it differs from the component key
#   path:          Path within the Git repo that ArgoCD should sync (default: ".")
#   namespace:     Target Kubernetes namespace
#   values:        Helm values overrides applied in both source and chart mode
#   syncWave:      ArgoCD sync wave for ordering (lower = earlier)
#   disabled:      Set true to skip this component entirely
#
# Per-developer overrides (ecosystem.local.yaml) additionally support:
#   forceChart:    Use chart even when local source exists (for testing)
