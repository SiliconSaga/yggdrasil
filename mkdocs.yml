site_name: Yggdrasil
site_url: https://siliconsaga.github.io/yggdrasil
site_description: Workspace root for the SiliconSaga ecosystem — docs, skills, and Guardian Driven Development
repo_url: https://github.com/SiliconSaga/yggdrasil
repo_name: SiliconSaga/yggdrasil

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - toc.follow
    - content.code.copy

not_in_nav: |
  /agent-security/**
  /plans/**

validation:
  links:
    not_found: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Yggdrasil:
    - Ecosystem Architecture: ecosystem-architecture.md
    - Dev Setup: dev-setup.md
    - IDE Setup: ide-setup.md
    - WS CLI Guide: ws-cli-guide.md
    - Code Style: code-style.md
    - Git Provider Setup: git-provider-setup.md
    - Cross-Fork CR Internals: cr-internals.md
    - Multi-Repo Workflow: multi-repo-workflow.md
  - Guardian Driven Development:
    - Overview: gdd/index.md
    - Features Tour: gdd/features.md
    - Roles and Modes: gdd/roles-and-modes.md
    - The Thalamus: gdd/thalamus.md
    - Realms: gdd/realms.md
    - Hoards: gdd/hoards.md
    - Trust and Safety: gdd/trust-and-safety.md
    - Access: gdd/access.md
    - Permissions: gdd/permissions.md
    - Self-Improving Loop: gdd/self-improving-loop.md
    - Samples:
      - gdd/samples/index.md
      - "Session 1: GDD Pilot": gdd/samples/session-1-gdd-pilot.md
      - "Session 2: Review Threads": gdd/samples/session-2-review-threads.md
      - "Thalamus: Primary": gdd/samples/thalamus-primary.md
      - "Thalamus: Primary Processed": gdd/samples/thalamus-processed.md
      - "Thalamus: Parallel": gdd/samples/thalamus-parallel.md
  - Getting Started:
    - getting-started/index.md
