# .project.yaml — ADSE project hoard configuration
# This file is read by ws project status/build/publish/merge.
# Replace placeholder values (marked with <>) before first build.

template: sadd
title: "<Project Name>"
authors:
  - name: "<Your Name>"
    email: "<you@example.com>"
approvers: []
  # - name: "<Approver Name>"
  #   role: "<Role>"
plc_template: "SWE-PLC-L1-002-BasicPLC-SADD-TMPL"

# Revision history — add an entry each time you cut a meaningful version.
# Rendered as the Revision History table in the assembled document.
revisions:
  - version: "0.1"
    date: "YYYY-MM-DD"
    author: "<Your Name>"
    description: "Initial draft"

# Sections that must be present for ws project build to succeed.
# Build fails with a clear error if any mandatory section has no tagged file.
mandatory:
  - purpose-scope
  - value-prop
  - assumptions
  - constraints
  - architecture
  - design-alternatives
  - static-design
  - dynamic-design
  - security
  - testing

# Full section order for the assembled document.
# Optional sections (not in mandatory:) are silently omitted if not present.
# Section files can live anywhere in the hoard (except working/) as long as
# they carry a matching sadd_section: frontmatter key.
sections:
  - id: purpose-scope
  - id: value-prop
  - id: assumptions
  - id: constraints
  - id: dependencies
  - id: glossary
  - id: references
  - id: architecture
  - id: design-alternatives
  - id: static-design
  - id: dynamic-design
  - id: security
  - id: testing
  - id: other-ha
  - id: other-scalability
  - id: other-future-work
  - id: open-questions

build_targets:
  gdoc_id: ""         # set after ws project publish gdoc
  confluence_space: "" # set if collab path used
