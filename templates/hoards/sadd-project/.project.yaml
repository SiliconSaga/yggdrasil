# .project.yaml — ADSE project hoard configuration
# This file is read by ws project status/build/publish/merge.
# Replace placeholder values (marked with <>) before first build.

template: sadd
title: "<Project Name>"
authors:
  - name: "<Your Name>"
    email: "<you@example.com>"
approvers: []
  # - name: "<Approver Name>"
  #   role: "<Role>"
plc_template: "SWE-PLC-L1-002-BasicPLC-SADD-TMPL"

# Revision history — add an entry each time you cut a meaningful version.
# Rendered as the Revision History table in the assembled document.
revisions:
  - version: "0.1"
    date: "YYYY-MM-DD"
    author: "<Your Name>"
    description: "Initial draft"

# Sections that must be present for ws project build to succeed.
# Build fails with a clear error if any mandatory section has no tagged file.
# To promote an optional section to mandatory, move its id here from sections:.
mandatory:
  - purpose-scope
  - value-prop
  - assumptions
  - constraints
  - architecture
  - design-alternatives
  - static-design
  - dynamic-design
  - security
  - testing

# Assembly order for the document. Sections not listed here are silently
# omitted from the build even if a file carries that sadd_section: id.
#
# Sections listed here but not in mandatory: are optional — the build succeeds
# whether or not a matching file exists.
#
# To add a custom section: create a .md file anywhere in the hoard (not
# under working/) with sadd_section: <your-id> in its YAML frontmatter,
# then add <your-id> here at the position you want it to appear.
# Until you add it here the section shows as "? extra" in ws project status
# and is excluded from the assembled output.
sections:
  - purpose-scope
  - value-prop
  - assumptions
  - constraints
  - dependencies
  - glossary
  - references
  - architecture
  - design-alternatives
  - static-design
  - dynamic-design
  - security
  - testing
  - other-ha
  - other-scalability
  - other-future-work
  - open-questions

build_targets:
  gdoc_id: ""         # set after ws project publish gdoc
  confluence_space: "" # set if collab path used
