# Upgrade recipe for thalami hoards.
#
# version 1 = the Dataview-only baseline the existing hoards shipped with.
# version 2 adds Meta Bind and the ArcDashboard controls region: a refresh
# button (fixes Dataview's stale date(today) on long-open panes), a filter
# box, and a sort-by dropdown with direction toggle. The query logic those
# controls drive lives in the base ArcDashboard.md (delivered on init), so
# the controls region only renders correctly atop a v2 base dashboard.
#
# Applied by `ws hoard upgrade <hoard> --plan/--apply` (provenance resolves
# this template via the hoard's .hoard.yaml). Plugin code is downloaded fresh
# from the pinned GitHub release and verified against the assets lock before
# install; refresh a changed pin with `ws hoard lock thalami --plugin <id>`,
# review the lock-only diff, then increment the top-level version.
# manifest.json + data.json are tracked in the hoard.
version: 2
description: |
  Dataview for the ArcDashboard, plus Meta Bind for the dashboard's
  interactive controls (force-refresh button, filter box, sort dropdown).
plugins:
  - id: dataview
    name: Dataview
    description: Query engine powering ArcDashboard.md.
    repo: blacksmithgu/obsidian-dataview
    pin: "0.5.68"
    assets:
      "main.js": "sha256:794e9eaede73920bb8d54b0eda4f5de2182d698cc638774500f24f14bcd4da0b"
      "manifest.json": "sha256:9235db47112da81b85591c79ecb9ae2574e5e72207056e976472f90616286185"
      "styles.css": "sha256:3306dd9032e00f989ba7233a37fd255bc4d3f4340cee661762e952f3f6aa1de9"
  - id: obsidian-meta-bind-plugin
    name: Meta Bind
    description: Inline buttons/inputs bound to frontmatter; powers the ArcDashboard controls.
    repo: mProjectsCode/obsidian-meta-bind-plugin
    # Verified 2026-05-24 against the live release: tag 1.4.10 ships
    # main.js / manifest.json / styles.css, and manifest id ==
    # obsidian-meta-bind-plugin (minAppVersion 1.10.0).
    pin: "1.4.10"
    assets:
      "main.js": "sha256:6ceef9a2d5c515ea1359606b3c11697eb9ee804c08d17a960adadc1d53c05820"
      "manifest.json": "sha256:c1ac1278bac6ee75f3f90499175e270954170e9ca7580eadfb53d84e4a9a7edf"
      "styles.css": "sha256:06a48ecebb8bcc9919c3a2e44894efc6065c3c3a232db7c9baa504e965f3b5b2"
managed_regions:
  - file: ArcDashboard.md
    id: controls
    source: regions/arcdashboard-controls.md
